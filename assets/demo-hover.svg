<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal background -->
  <rect width="800" height="340" rx="6" fill="#0e1019"/>

  <!-- Neovim top bar -->
  <rect width="800" height="20" rx="6" fill="#1a1b26"/>
  <rect y="14" width="800" height="6" fill="#1a1b26"/>
  <text x="16" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">NORMAL</text>
  <text x="100" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#c0caf5">kitty.conf</text>
  <text x="700" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">[kitty-lsp]</text>

  <!-- Line number gutter -->
  <rect x="0" y="20" width="32" height="300" fill="#0e1019"/>

  <!-- Code lines -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="12" y="44" fill="#3b4261">1</text>
    <text x="40" y="44" fill="#565f89"># Cursor customization</text>

    <!-- Line 2 -->
    <text x="12" y="64" fill="#3b4261">2</text>

    <!-- Line 3: cursor_shape hovered -->
    <text x="12" y="84" fill="#3b4261">3</text>
    <!-- Hover underline -->
    <rect x="39" y="72" width="96" height="16" fill="#292e42" rx="1"/>
    <text x="40" y="84" fill="#7aa2f7" text-decoration="underline">cursor_shape</text>
    <text x="136" y="84" fill="#9ece6a"> beam</text>

    <!-- Line 4 -->
    <text x="12" y="104" fill="#3b4261">4</text>
    <text x="40" y="104" fill="#7aa2f7">cursor_blink_interval</text>
    <text x="208" y="104" fill="#ff9e64"> -1</text>

    <!-- Line 5 -->
    <text x="12" y="124" fill="#3b4261">5</text>
    <text x="40" y="124" fill="#7aa2f7">cursor_stop_blinking_after</text>
    <text x="240" y="124" fill="#ff9e64"> 15.0</text>

    <!-- Line 6 -->
    <text x="12" y="144" fill="#3b4261">6</text>
  </g>

  <!-- Hover floating window -->
  <g filter="url(#dropShadow)">
    <rect x="38" y="90" width="420" height="140" rx="4" fill="#1a1b26" stroke="#292e42" stroke-width="1"/>

    <!-- Header -->
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
      <text x="54" y="112" fill="#7aa2f7" font-weight="700">`cursor_shape`</text>
      <text x="186" y="112" fill="#565f89">: `enum`</text>
    </g>

    <rect x="38" y="118" width="420" height="1" fill="#292e42"/>

    <!-- Body -->
    <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13">
      <text x="54" y="138" fill="#a9b1d6">The shape of the cursor.</text>

      <text x="54" y="160" fill="#565f89">**Category:** Cursor</text>

      <text x="54" y="182" fill="#565f89">**Default:** </text>
      <text x="130" y="182" fill="#ff9e64" font-family="monospace">`block`</text>

      <text x="54" y="204" fill="#565f89">**Allowed values:** </text>
      <text x="180" y="204" fill="#9ece6a" font-family="monospace">`block`</text>
      <text x="218" y="204" fill="#565f89">, </text>
      <text x="230" y="204" fill="#9ece6a" font-family="monospace">`beam`</text>
      <text x="264" y="204" fill="#565f89">, </text>
      <text x="276" y="204" fill="#9ece6a" font-family="monospace">`underline`</text>

      <text x="54" y="224" fill="#f59e0b" font-size="11">Kitty Documentation</text>
    </g>
  </g>

  <!-- Status line -->
  <rect y="320" width="800" height="20" fill="#1a1b26"/>
  <text x="16" y="334" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">kitty-lsp</text>
  <text x="720" y="334" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">3:1</text>
  <text x="755" y="334" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">utf-8</text>
</svg>
