<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <!-- Terminal background -->
  <rect width="800" height="360" rx="6" fill="#0e1019"/>

  <!-- Neovim top bar -->
  <rect width="800" height="20" rx="6" fill="#1a1b26"/>
  <rect y="14" width="800" height="6" fill="#1a1b26"/>
  <text x="16" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">NORMAL</text>
  <text x="100" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#c0caf5">kitty.conf</text>
  <text x="700" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">[kitty-lsp]</text>

  <!-- Line number gutter -->
  <rect x="0" y="20" width="32" height="320" fill="#0e1019"/>

  <!-- Diagnostic signs in gutter -->
  <text x="6" y="104" font-family="monospace" font-size="12" fill="#db4b4b">E</text>
  <text x="6" y="164" font-family="monospace" font-size="12" fill="#e0af68">W</text>
  <text x="6" y="204" font-family="monospace" font-size="12" fill="#db4b4b">E</text>

  <!-- Code lines -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="12" y="44" fill="#3b4261">1</text>
    <text x="40" y="44" fill="#565f89"># My kitty config</text>

    <!-- Line 2 -->
    <text x="12" y="64" fill="#3b4261">2</text>

    <!-- Line 3: valid -->
    <text x="12" y="84" fill="#3b4261">3</text>
    <text x="40" y="84" fill="#7aa2f7">font_family</text>
    <text x="128" y="84" fill="#9ece6a"> monospace</text>

    <!-- Line 4: unknown key - error underline -->
    <text x="12" y="104" fill="#3b4261">4</text>
    <text x="40" y="104" fill="#db4b4b">fonnt_size</text>
    <!-- Diagnostic underline (red squiggly) -->
    <g fill="none" stroke="#db4b4b" stroke-width="1.2" opacity="0.8">
      <path d="M40,109 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2"/>
    </g>
    <text x="120" y="104" fill="#ff9e64"> 12.0</text>

    <!-- Line 5 -->
    <text x="12" y="124" fill="#3b4261">5</text>

    <!-- Virtual text diagnostic (inline) -->
    <text x="160" y="104" fill="#db4b4b" font-size="11" opacity="0.7">Unknown kitty config option: "fonnt_size"</text>

    <!-- Line 6: invalid enum value -->
    <text x="12" y="144" fill="#3b4261">6</text>

    <!-- Line 7: valid key, bad value -->
    <text x="12" y="164" fill="#3b4261">7</text>
    <text x="40" y="164" fill="#7aa2f7">cursor_shape</text>
    <text x="136" y="164" fill="#e0af68"> rectangle</text>
    <!-- Yellow squiggly under value -->
    <g fill="none" stroke="#e0af68" stroke-width="1.2" opacity="0.8">
      <path d="M144,169 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2"/>
    </g>

    <!-- Virtual text -->
    <text x="240" y="164" fill="#e0af68" font-size="11" opacity="0.7">Allowed: block, beam, underline</text>

    <!-- Line 8 -->
    <text x="12" y="184" fill="#3b4261">8</text>

    <!-- Line 9: invalid color -->
    <text x="12" y="204" fill="#3b4261">9</text>
    <text x="40" y="204" fill="#7aa2f7">foreground</text>
    <text x="120" y="204" fill="#db4b4b"> #xyz123</text>
    <!-- Red squiggly -->
    <g fill="none" stroke="#db4b4b" stroke-width="1.2" opacity="0.8">
      <path d="M128,209 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2 l2,-2 l2,2"/>
    </g>

    <!-- Virtual text -->
    <text x="220" y="204" fill="#db4b4b" font-size="11" opacity="0.7">Invalid color value</text>

    <!-- Line 10 -->
    <text x="8" y="224" fill="#3b4261">10</text>

    <!-- Line 11: valid -->
    <text x="8" y="244" fill="#3b4261">11</text>
    <text x="40" y="244" fill="#7aa2f7">background</text>
    <text x="120" y="244" fill="#9ece6a"> #1a1b26</text>

    <!-- Line 12 -->
    <text x="8" y="264" fill="#3b4261">12</text>
    <text x="40" y="264" fill="#7aa2f7">background_opacity</text>
    <text x="184" y="264" fill="#ff9e64"> 0.95</text>

    <!-- Line 13 -->
    <text x="8" y="284" fill="#3b4261">13</text>
  </g>

  <!-- Neovim diagnostic count in statusline -->
  <rect y="340" width="800" height="20" fill="#1a1b26"/>
  <text x="16" y="354" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">kitty-lsp</text>

  <!-- Error/warning counts -->
  <text x="120" y="354" font-family="'Cascadia Code', monospace" font-size="11" fill="#db4b4b">E:2</text>
  <text x="160" y="354" font-family="'Cascadia Code', monospace" font-size="11" fill="#e0af68">W:1</text>

  <text x="720" y="354" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">4:1</text>
  <text x="755" y="354" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">utf-8</text>
</svg>
