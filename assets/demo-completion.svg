<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal background -->
  <rect width="800" height="460" rx="6" fill="#0e1019"/>

  <!-- Neovim top bar -->
  <rect width="800" height="20" rx="6" fill="#1a1b26"/>
  <rect y="14" width="800" height="6" fill="#1a1b26"/>
  <text x="16" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">NORMAL</text>
  <text x="100" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#c0caf5">kitty.conf</text>
  <text x="700" y="14" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">[kitty-lsp]</text>

  <!-- Line number gutter -->
  <rect x="0" y="20" width="32" height="420" fill="#0e1019"/>

  <!-- Code lines -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
    <!-- Line 1 -->
    <text x="12" y="44" fill="#3b4261">1</text>
    <text x="40" y="44" fill="#565f89"># Font Configuration</text>

    <!-- Line 2 -->
    <text x="12" y="64" fill="#3b4261">2</text>
    <text x="40" y="64" fill="#7aa2f7">font_family</text>
    <text x="128" y="64" fill="#9ece6a"> FiraCode Nerd Font</text>

    <!-- Line 3 -->
    <text x="12" y="84" fill="#3b4261">3</text>
    <text x="40" y="84" fill="#7aa2f7">font_size</text>
    <text x="112" y="84" fill="#ff9e64"> 12.0</text>

    <!-- Line 4 -->
    <text x="12" y="104" fill="#3b4261">4</text>

    <!-- Line 5: typing cursor_ -->
    <text x="12" y="124" fill="#3b4261">5</text>
    <text x="40" y="124" fill="#7aa2f7">cursor_</text>
    <!-- Cursor block -->
    <rect x="96" y="112" width="8" height="16" fill="#c0caf5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Line 6 -->
    <text x="12" y="144" fill="#3b4261">6</text>

    <!-- Line 7 -->
    <text x="12" y="164" fill="#3b4261">7</text>
    <text x="40" y="164" fill="#565f89"># Colors</text>

    <!-- Line 8 -->
    <text x="12" y="184" fill="#3b4261">8</text>
    <text x="40" y="184" fill="#7aa2f7">foreground</text>
    <text x="120" y="184" fill="#9ece6a"> #c0caf5</text>
  </g>

  <!-- Neovim completion popup (pum) -->
  <g filter="url(#dropShadow)">
    <rect x="38" y="130" width="320" height="200" rx="2" fill="#1a1b26" stroke="#292e42" stroke-width="1"/>

    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">
      <!-- Selected item - highlight bar -->
      <rect x="40" y="132" width="316" height="22" fill="#283457"/>
      <text x="48" y="148" fill="#e0af68">P</text>
      <text x="64" y="148" fill="#c0caf5" font-weight="600">cursor_shape</text>
      <text x="240" y="148" fill="#565f89" font-size="10">enum [Cursor]</text>

      <!-- Item 2 -->
      <text x="48" y="170" fill="#e0af68">P</text>
      <text x="64" y="170" fill="#a9b1d6">cursor_beam_thickness</text>
      <text x="240" y="170" fill="#565f89" font-size="10">number</text>

      <!-- Item 3 -->
      <text x="48" y="192" fill="#e0af68">P</text>
      <text x="64" y="192" fill="#a9b1d6">cursor_underline_thickness</text>
      <text x="264" y="192" fill="#565f89" font-size="10">number</text>

      <!-- Item 4 -->
      <text x="48" y="214" fill="#e0af68">P</text>
      <text x="64" y="214" fill="#a9b1d6">cursor_blink_interval</text>
      <text x="240" y="214" fill="#565f89" font-size="10">number</text>

      <!-- Item 5 -->
      <text x="48" y="236" fill="#e0af68">P</text>
      <text x="64" y="236" fill="#a9b1d6">cursor_stop_blinking_after</text>
      <text x="264" y="236" fill="#565f89" font-size="10">number</text>

      <!-- Item 6 -->
      <text x="48" y="258" fill="#e0af68">P</text>
      <text x="64" y="258" fill="#a9b1d6">cursor_trail</text>
      <text x="240" y="258" fill="#565f89" font-size="10">number</text>

      <!-- Item 7 -->
      <text x="48" y="280" fill="#e0af68">P</text>
      <text x="64" y="280" fill="#a9b1d6">cursor_trail_decay</text>
      <text x="240" y="280" fill="#565f89" font-size="10">string</text>

      <!-- Item 8 -->
      <text x="48" y="302" fill="#e0af68">P</text>
      <text x="64" y="302" fill="#a9b1d6">cursor_trail_start_threshold</text>
      <text x="276" y="302" fill="#565f89" font-size="10">number</text>

      <!-- Scrollbar hint -->
      <rect x="352" y="132" width="4" height="50" rx="2" fill="#565f89" opacity="0.4"/>
    </g>
  </g>

  <!-- Documentation float (right of popup) -->
  <g filter="url(#dropShadow)">
    <rect x="362" y="130" width="340" height="110" rx="2" fill="#1a1b26" stroke="#292e42" stroke-width="1"/>
    <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12">
      <text x="376" y="150" fill="#7aa2f7" font-weight="600" font-family="monospace">cursor_shape</text>
      <text x="490" y="150" fill="#565f89">: enum</text>
      <rect x="362" y="156" width="340" height="1" fill="#292e42"/>
      <text x="376" y="174" fill="#a9b1d6">The shape of the cursor.</text>
      <text x="376" y="196" fill="#565f89">Values: </text>
      <text x="430" y="196" fill="#9ece6a" font-family="monospace">block | beam | underline</text>
      <text x="376" y="218" fill="#565f89">Default: </text>
      <text x="436" y="218" fill="#ff9e64" font-family="monospace">block</text>
      <text x="376" y="234" fill="#f59e0b" font-size="10">sw.kovidgoyal.net/kitty/conf/</text>
    </g>
  </g>

  <!-- Status line -->
  <rect y="440" width="800" height="20" rx="0" fill="#1a1b26"/>
  <rect y="440" width="800" height="6" fill="#1a1b26"/>
  <text x="16" y="454" font-family="'Cascadia Code', monospace" font-size="11" fill="#7aa2f7">kitty-lsp</text>
  <text x="720" y="454" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">5:8</text>
  <text x="755" y="454" font-family="'Cascadia Code', monospace" font-size="11" fill="#565f89">utf-8</text>
</svg>
